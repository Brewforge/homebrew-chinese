name: automerge

on:
  schedule:
    - cron: "0 6 * * *"
  # Merge as soon as the required check finishes, instead of waiting for the
  # daily cron (which GitHub delays by hours).
  workflow_run:
    workflows: ["validate"]
    types: [completed]
  workflow_dispatch:

# Serialise runs: two concurrent runs can try to merge the same pull request.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge-prs:
    name: Auto merge PRs
    if: github.repository == 'brewforge/homebrew-chinese'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
      REPO: brewforge/homebrew-chinese
    steps:
      - name: Auto merge PRs
        shell: bash
        run: |
          # Merge states where GitHub will actually accept the merge. BLOCKED
          # (pending/failed required checks, unresolved conversations) and DIRTY
          # (merge conflict) are skipped instead of attempted.
          mergeable_states=" CLEAN HAS_HOOKS UNSTABLE "
          allowed_authors=" Brewforge-Bot-0 ivaquero "

          pr_fields="number,title,headRefName,author,isDraft,mergeStateStatus,headRefOid"
          # Only listing identity here: merge state is re-read for every candidate
          # right before merging, because each merge invalidates the snapshot.
          pr_filter='.[]
            | select(.isDraft | not)
            | select((((.title // "") + " " + (.headRefName // "")) | ascii_downcase | contains("nightly")) | not)
            | "\(.number)\t\(.author.login)"'

          # Command substitution, not process substitution: a failing `gh pr list`
          # must fail the step instead of looking like "no pull requests".
          listed=$(gh pr list --repo "$REPO" --state open --limit 1000 \
            --json "$pr_fields" --jq "$pr_filter")
          candidates=()
          while IFS= read -r row; do
            if [ -n "$row" ]; then
              candidates+=("$row")
            fi
          done <<< "$listed"

          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "No open pull requests to consider"
            exit 0
          fi

          resolve_state() {
            local number="$1" state=""
            for _ in {1..6}; do
              state=$(gh pr view "$number" --repo "$REPO" --json mergeStateStatus \
                --jq .mergeStateStatus 2>/dev/null || echo UNKNOWN)
              if [ "$state" != "UNKNOWN" ]; then
                echo "$state"
                return 0
              fi
              sleep 10
            done
            echo UNKNOWN
          }

          considered=0 merged=0 failed=0
          for row in "${candidates[@]}"; do
            number="${row%%$'\t'*}"
            author="${row#*$'\t'}"

            if [[ "$allowed_authors" != *" $author "* ]]; then
              continue
            fi
            considered=$((considered + 1))

            # Always fresh: a merge earlier in this loop can flip a CLEAN pull
            # request to BEHIND or BLOCKED, so the value from the initial list
            # is only a hint.
            state=$(resolve_state "$number")
            if [[ "$mergeable_states" != *" $state "* ]]; then
              hint=""
              [ "$state" = "BEHIND" ] && hint=" (base branch moved; needs an update)"
              echo "Skipping #$number ($author): mergeStateStatus=$state$hint"
              continue
            fi

            head=$(gh pr view "$number" --repo "$REPO" --json headRefOid \
              --jq .headRefOid 2>/dev/null || true)
            if [ -z "$head" ]; then
              echo "::error::Could not read head commit of PR #$number"
              failed=$((failed + 1))
              continue
            fi

            echo "Processing #$number ($author, $state) head ${head:0:8}"
            if gh pr merge "$number" --repo "$REPO" --merge --delete-branch \
              --match-head-commit "$head"; then
              echo "Merged #$number"
              merged=$((merged + 1))
              sleep 10
              continue
            fi

            # Distinguish "merge refused because the state moved under us" from a
            # real failure: only the latter should turn the job red.
            current=$(resolve_state "$number")
            if [[ "$mergeable_states" != *" $current "* ]]; then
              echo "::warning::Skipped #$number: mergeStateStatus changed to $current during the run"
            else
              echo "::error::Failed to merge PR #$number (mergeStateStatus=$current)"
              failed=$((failed + 1))
            fi
          done

          echo "Merged $merged, failed $failed, considered $considered of ${#candidates[@]} open PR(s)"
          if [ "$failed" -gt 0 ]; then
            exit 1
          fi
